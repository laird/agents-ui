id: agents-ui
name: agents-ui
tier: custom
persona: Tech lead
mandate: Know when a feature is live
product_summary: >-
  agents-ui (the agents-tui command) is one place to launch, watch, and supervise swarms of AI
  coding agents working on a developer's own repositories: a manager agent plus several workers,
  each in its own copy of the repository. It shows which agents are working, idle, stalled, or
  waiting on a person, and lets the developer jump into any agent's live session and answer it.
  It runs as a terminal app, as a web dashboard, and as a "village" picture of the swarm in the
  browser, and reads swarms from tmux, herdr, and Temporal.
