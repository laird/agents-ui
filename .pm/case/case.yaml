lanes:
  - id: feature-to-production
    name: A feature from spec to production
    surface: desktop web
    viewport: { width: 1440, height: 900 }
    territory: >-
      A new feature is a high-level task (a parent issue, often from a spec) broken into
      subtasks; each subtask is claimed, built, tested and landed by the swarm; when all
      subtasks are done the whole feature is validated and deployed through the
      environments (dev, then UAT, then production). In: decomposition into subtasks
      (autocoder's decomposed and subtask labels, modernize's PLAN.md phases), per-subtask
      progress, the integration branch and green gate, environment promotion from
      .autocoder.json, and knowing when the feature (not one issue) is live on the platform
      (worlds: release to build-ID or image-tag matching). Out: attention and answering
      (the first run), launching swarms, billing, third-party key integrations.
    repo_entry_points:
      - src/web/village.rs
      - src/web/framework.rs
      - src/web/world.rs
      - src/web/village.html
      - src/model/issue.rs
      - src/web/kubernetes.rs
      - src/web/temporal.rs
  - id: attention-and-answering
    name: Attention and answering (first run, archived)
    surface: desktop web
    viewport: { width: 1440, height: 900 }
    territory: >-
      See outputs/attention-and-answering/01-discovery.md.
