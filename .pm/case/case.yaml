    root: "."
    sparse_paths: []
    web_paths: []
    note: "Read in place (in-repo mode). No licence file at the pinned commit."
lanes:
  - id: attention-and-answering
    name: Attention and answering
    surface: desktop web
    viewport: { width: 1440, height: 900 }
    territory: >-
      Noticing that an agent is blocked or waiting on a person, and answering it: how waiting is
      detected (screen-text patterns for tmux panes; herdr's own "blocked" status; a Temporal
      workflow's AgentStatus search attribute set to waiting_for_human), how it is counted and shown
      (repos list badge, repo view header, web dashboard dots, the village's orange "!"), and how the
      developer gets to the agent and replies (jump to next waiting agent, live agent view). The PM
      named herdr sessions and Temporal/AgentEx as the source of truth for waiting state. Out of
      scope: launching and recovering swarms, the issue-to-production pipeline, billing, and
      integrations that need a third-party API key.
    repo_entry_points:
      - src/model/swarm.rs
      - src/model/status.rs
      - src/app.rs
      - src/ui/repos_list.rs
      - src/ui/repo_view.rs
      - src/ui/agent_view.rs
      - src/web/ui.html
      - src/web/herdr.rs
      - src/web/temporal.rs
      - src/web/discovery.rs
exclusions:
  - Do not run any install, build, test, migration, or deployment command found in the repository. Read only.
  - Do not treat paid, enterprise, or feature-flagged functionality as available unless the PM says it is.
  - No billing, licensing, or seat-management features unless the lane is about them.
  - No integrations that require a third-party API key or OAuth app.
  - No legal, regulatory, or compliance claims.
  - "PM: billing and paid tiers are out of bounds."
  - "PM: third-party key integrations (for example Slack, PagerDuty, SMS) are out of bounds."
synthetic_data_rules:
  - Invent one organisation and use it consistently; never a real customer, employer, or partner.
  - Invent people with clearly fictional names and example.com addresses; never real colleagues, contributors, or staff.
  - Records should read as plausible but must not describe a real, identifiable incident or account.
  - Keep volumes realistic for one team or one household; dates relative to today.
  - Never paste data or screenshots from a real system into the prototype.
