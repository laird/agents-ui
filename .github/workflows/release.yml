name: release

# A published GitHub Release is a deployment to the `release` environment: the
# last stop of the village pipeline. Recording it as a GitHub Deployment of the
# release's tag commit is what moves the released issues there
# (src/web/deployments.rs reads the newest successful one per environment).
#
# Releases are cut by hand: gh release create vX.Y.Z --generate-notes
on:
  release:
    types: [published]

permissions:
  contents: read
  deployments: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: Record a deployment to the release environment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          # The tag's commit, peeled through an annotated tag if there is one.
          SHA=$(gh api "repos/$REPO/commits/$TAG" --jq .sha)
          ID=$(gh api "repos/$REPO/deployments" \
            -f ref="$SHA" -f environment=release -f description="Release $TAG" \
            -F auto_merge=false -F 'required_contexts[]' --jq .id)
          gh api "repos/$REPO/deployments/$ID/statuses" \
            -f state=success -f description="Release $TAG" \
            -f log_url="${{ github.event.release.html_url }}" >/dev/null
          echo "Recorded deployment $ID of $SHA ($TAG) to release"
