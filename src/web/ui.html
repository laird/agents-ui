<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agents UI</title>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --card: #21262d;
      --border: #30363d;
      --accent: #58a6ff;
      --text: #e6edf3;
      --text-dim: #8b949e;
      --success: #3fb950;
      --warning: #d29922;
      --error: #f85149;
      --working: #58a6ff;
      --idle: #8b949e;
      --radius: 6px;
      --shadow: 0 1px 3px rgba(0,0,0,0.4);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }

    /* ---- Header ---- */
    header {
      background: var(--surface);
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-title {
      font-size: 1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .header-title svg { flex-shrink: 0; }

    .refresh-indicator {
      font-size: 0.75rem;
      color: var(--text-dim);
    }

    /* ---- Main content ---- */
    main {
      padding: 1.25rem;
      max-width: 1280px;
      margin: 0 auto;
    }

    /* ---- Breadcrumb ---- */
    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
      font-size: 0.875rem;
      color: var(--text-dim);
    }

    .breadcrumb .crumb-link {
      color: var(--accent);
      cursor: pointer;
      text-decoration: none;
      background: none;
      border: none;
      font: inherit;
      padding: 0;
    }

    .breadcrumb .crumb-link:hover { text-decoration: underline; }
    .breadcrumb .crumb-sep { color: var(--border); }
    .breadcrumb .crumb-current { color: var(--text); }

    /* ---- Section heading ---- */
    .section-heading {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-dim);
      margin-bottom: 0.75rem;
    }

    /* ---- Swarms grid ---- */
    .swarms-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.75rem;
    }

    @media (min-width: 540px) {
      .swarms-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (min-width: 900px) {
      .swarms-grid { grid-template-columns: repeat(3, 1fr); }
    }

    @media (min-width: 1200px) {
      .swarms-grid { grid-template-columns: repeat(4, 1fr); }
    }

    /* ---- Swarm card ---- */
    .swarm-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }

    .swarm-card:hover {
      border-color: var(--accent);
      background: #2d333b;
    }

    .swarm-card:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .swarm-card.stopped { opacity: 0.55; }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.5rem;
      gap: 0.5rem;
    }

    .project-name {
      font-weight: 600;
      font-size: 0.9375rem;
      word-break: break-word;
    }

    .badge {
      flex-shrink: 0;
      font-size: 0.6875rem;
      padding: 0.15rem 0.5rem;
      border-radius: 2em;
      background: rgba(88,166,255,0.12);
      color: var(--accent);
      border: 1px solid rgba(88,166,255,0.25);
    }

    .card-path {
      font-size: 0.75rem;
      color: var(--text-dim);
      margin-bottom: 0.75rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-stats {
      display: flex;
      gap: 1rem;
    }

    .stat {
      display: flex;
      flex-direction: column;
      gap: 0.1rem;
    }

    .stat-value {
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1;
    }

    .stat-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-dim);
    }

    /* ---- Status dot ---- */
    .status-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .s-working  { background: var(--working); }
    .s-idle     { background: var(--idle); }
    .s-stopped  { background: var(--error); }
    .s-starting { background: var(--warning); animation: pulse 1s ease-in-out infinite; }
    .s-unknown  { background: var(--text-dim); }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    /* ---- Detail view ---- */
    .detail-title {
      font-size: 1.375rem;
      font-weight: 700;
      margin-bottom: 0.35rem;
    }

    .detail-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.625rem;
      font-size: 0.8125rem;
      color: var(--text-dim);
      margin-bottom: 1.25rem;
    }

    .detail-meta .meta-item {
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .action-bar {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 0.75rem;
    }
    .action-btn {
      padding: 0.35rem 0.85rem;
      border-radius: 6px;
      font-size: 0.8125rem;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid transparent;
      transition: opacity 0.15s;
    }
    .action-btn:hover { opacity: 0.8; }
    .action-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .stop-btn { background: var(--error); color: #fff; }
    .start-btn { background: var(--accent); color: #fff; }
    .add-worker-btn { background: var(--surface); color: var(--text); border-color: var(--border); }
    .new-issue-btn  { background: var(--surface); color: var(--text); border-color: var(--border); margin-left: auto; }
    .agent-type-select {
      background: var(--surface); color: var(--text);
      border: 1px solid var(--border); border-radius: var(--radius);
      padding: 0.3rem 0.5rem; font-size: 0.8rem; cursor: pointer;
    }

    /* ---- Issue creation modal ---- */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.6);
      display: flex; align-items: center; justify-content: center;
      z-index: 999;
    }
    .modal {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      width: min(480px, 92vw);
      display: flex; flex-direction: column; gap: 0.75rem;
    }
    .modal-title { font-size: 1rem; font-weight: 600; }
    .modal-row { display: flex; flex-direction: column; gap: 0.25rem; }
    .modal-label { font-size: 0.75rem; color: var(--text-dim); }
    .modal-input, .modal-textarea, .modal-select {
      background: var(--surface); color: var(--text);
      border: 1px solid var(--border); border-radius: var(--radius);
      padding: 0.4rem 0.6rem; font-size: 0.875rem; font-family: inherit;
    }
    .modal-textarea { resize: vertical; min-height: 80px; }
    .modal-select { cursor: pointer; }
    .modal-row-inline { display: flex; gap: 0.5rem; }
    .modal-row-inline .modal-row { flex: 1; }
    .modal-actions { display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 0.25rem; }
    .modal-cancel { background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.4rem 0.9rem; cursor: pointer; font-size: 0.875rem; }
    .modal-cancel:hover { opacity: 0.8; }
    .modal-submit { background: var(--accent); color: #fff; border: none; border-radius: var(--radius); padding: 0.4rem 0.9rem; cursor: pointer; font-size: 0.875rem; font-weight: 600; }
    .modal-submit:hover { opacity: 0.85; }
    .modal-submit:disabled { opacity: 0.45; cursor: not-allowed; }
    .modal-status { font-size: 0.8rem; min-height: 1.2em; }
    .modal-status.ok    { color: var(--success); }
    .modal-status.error { color: var(--error); }
    .modal-labels { display: flex; flex-wrap: wrap; gap: 0.35rem; }
    .label-toggle {
      font-size: 0.7rem; padding: 0.15rem 0.45rem;
      border: 1px solid var(--border); border-radius: 2em;
      cursor: pointer; background: var(--surface); color: var(--text-dim);
      user-select: none;
    }
    .label-toggle.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    .detail-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.75rem;
    }

    @media (min-width: 640px) {
      .detail-layout { grid-template-columns: 1fr 1fr; }
    }

    @media (min-width: 1024px) {
      .detail-layout { grid-template-columns: 320px 1fr; }
    }

    /* ---- Panel ---- */
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .panel-header {
      padding: 0.5rem 0.875rem;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .panel-count {
      background: rgba(255,255,255,0.08);
      padding: 0.1rem 0.4rem;
      border-radius: 2em;
      font-size: 0.6875rem;
    }

    .agent-list { padding: 0.25rem; }

    .issues-panel { margin-top: 1rem; }
    .issues-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8125rem;
    }
    .issues-table th {
      text-align: left;
      color: var(--text-dim);
      font-weight: 500;
      padding: 0.25rem 0.5rem;
      border-bottom: 1px solid var(--border);
    }
    .issues-table td { padding: 0.3rem 0.5rem; }
    .issues-table tr:hover td { background: rgba(255,255,255,0.04); }
    .issue-num a { color: var(--accent); text-decoration: none; }
    .issue-num a:hover { text-decoration: underline; }
    .issue-pri { color: var(--text-dim); white-space: nowrap; }
    .issue-title { max-width: 32rem; }
    .issue-blocked td { color: var(--warning); }
    .issue-working .issue-title, .issue-working .issue-status { color: #6699ff; }

    .agent-row {
      display: flex;
      align-items: center;
      gap: 0.625rem;
      padding: 0.625rem 0.625rem;
      border-radius: calc(var(--radius) - 1px);
      cursor: pointer;
    }

    .agent-row:hover { background: rgba(255,255,255,0.06); }

    .agent-row:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
    }

    .agent-row-arrow {
      color: var(--text-dim);
      font-size: 0.75rem;
      flex-shrink: 0;
    }

    .agent-info { flex: 1; min-width: 0; }

    .agent-role {
      font-size: 0.875rem;
      font-weight: 500;
    }

    .agent-state-text {
      font-size: 0.75rem;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .agent-state-text .needs-input {
      color: var(--warning);
    }
    .health-icon { font-size: 0.8rem; font-weight: bold; }
    .health-ok      { color: #44cc44; }
    .health-warn    { color: #cccc44; }
    .health-restart { color: #44cccc; }
    .health-dead    { color: #cc4444; }
    .agent-completed { color: var(--text-dim); font-size: 0.75rem; }
    .agent-restarts  { color: var(--warning); font-size: 0.75rem; }
    /* One dot per agent on the swarm card: the shape of the swarm at a glance,
       without opening it. */
    .agent-dots {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin: 0.85rem 0 0.35rem;
      align-items: center;
      min-height: 0.85rem;
    }
    .agent-dot {
      width: 0.85rem;
      height: 0.85rem;
      border-radius: 50%;
      flex: none;
      background: var(--idle);
    }
    .agent-dots-empty {
      color: var(--text-dim);
      font-size: 0.75rem;
    }
    /* The manager carries the swarm, so it reads as a ring rather than
       another interchangeable worker dot. */
    .agent-dot.is-manager {
      box-shadow: 0 0 0 2px var(--card), 0 0 0 3px currentColor;
      color: var(--text-dim);
    }
    .dot-active  { background: var(--success); }
    .dot-idle    { background: var(--idle); }
    .dot-waiting { background: var(--warning); }
    .dot-stuck   { background: var(--error); }

    .agent-worktree  { color: var(--text-dim); font-size: 0.75rem; }
    .agent-branch    { color: var(--accent); font-size: 0.75rem; }

    /* ---- Session view ---- */
    .session-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.875rem;
    }

    .session-title {
      font-size: 1.125rem;
      font-weight: 700;
    }

    .session-target {
      font-size: 0.75rem;
      color: var(--text-dim);
      font-family: monospace;
    }

    .terminal-wrap {
      background: #0a0c10;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 0.75rem;
    }

    .terminal-toolbar {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 0.4rem 0.75rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.7rem;
      color: var(--text-dim);
    }

    .terminal-toolbar button {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-dim);
      font: inherit;
      font-size: 0.7rem;
      padding: 0.15rem 0.5rem;
      border-radius: 3px;
      cursor: pointer;
    }

    .terminal-toolbar button:hover {
      background: rgba(255,255,255,0.06);
      color: var(--text);
    }

    .terminal-output {
      font-family: 'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', monospace;
      font-size: 0.8125rem;
      line-height: 1.45;
      color: #c9d1d9;
      white-space: pre-wrap;
      word-break: break-all;
      padding: 0.75rem 1rem;
      min-height: 200px;
      max-height: 55vh;
      overflow-y: auto;
    }

    .input-row {
      display: flex;
      gap: 0.5rem;
      align-items: stretch;
    }

    .key-row {
      display: flex;
      gap: 0.35rem;
      flex-wrap: wrap;
      margin-bottom: 0.5rem;
      align-items: center;
    }
    .key-btn {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.3rem 0.6rem;
      font-size: 0.8125rem;
      font-family: inherit;
      cursor: pointer;
      min-width: 2.2rem;
    }
    .key-btn:hover  { background: var(--surface); border-color: var(--accent); }
    .key-btn:active { background: var(--accent); color: var(--bg); }
    .key-row-label  { color: var(--text-dim); font-size: 0.75rem; margin-right: 0.15rem; }
    .key-hint       { color: var(--text-dim); font-size: 0.75rem; margin-left: auto; }
    .terminal-output:focus {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
    }

    .session-input {
      flex: 1;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: 'SFMono-Regular', Consolas, monospace;
      font-size: 0.875rem;
      padding: 0.5rem 0.75rem;
      outline: none;
      transition: border-color 0.15s;
    }

    .session-input:focus {
      border-color: var(--accent);
    }

    .session-input::placeholder {
      color: var(--text-dim);
    }

    .send-btn {
      background: var(--accent);
      border: none;
      border-radius: var(--radius);
      color: #0d1117;
      font-weight: 600;
      font-size: 0.875rem;
      padding: 0.5rem 1rem;
      cursor: pointer;
      white-space: nowrap;
      transition: opacity 0.15s;
    }

    .send-btn:hover   { opacity: 0.85; }
    .send-btn:active  { opacity: 0.7;  }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .send-feedback {
      font-size: 0.75rem;
      margin-top: 0.4rem;
      min-height: 1rem;
    }

    /* Alert panels keep their reserved height when empty so the layout does
       not jump as messages come and go; the row only lays out when there is
       something to dismiss. */
    .alert-row {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
    }
    .alert-row > :first-child { flex: 1; }
    .alert-close {
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
      padding: 0 0.25rem;
      border-radius: var(--radius);
    }
    .alert-close:hover { color: var(--text); background: var(--surface); }

    .send-feedback.ok    { color: var(--success); }
    .send-feedback.error { color: var(--error); }

    /* ---- Empty / loading states ---- */
    .empty-state {
      padding: 2.5rem 1.5rem;
      text-align: center;
      color: var(--text-dim);
      font-size: 0.875rem;
    }

    .loading-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 5rem 1.5rem;
      gap: 1rem;
      color: var(--text-dim);
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---- Error banner ---- */
    .error-banner {
      background: rgba(248,81,73,0.12);
      border: 1px solid rgba(248,81,73,0.3);
      color: var(--error);
      border-radius: var(--radius);
      padding: 0.75rem 1rem;
      font-size: 0.875rem;
      margin-bottom: 1rem;
    }

    /* ---- Stopped badge (detail title) ---- */
    .stopped-badge {
      color: var(--error);
      font-size: 0.75rem;
    }

    /* ---- Empty-state hint line ---- */
    .empty-hint {
      margin-top: 0.5rem;
      font-size: 0.8125rem;
    }

    /* ---- Launch panel ---- */
    .launch-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 1.25rem;
      overflow: hidden;
    }

    .launch-panel-header {
      padding: 0.5rem 0.875rem;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
    }

    .launch-panel-header:hover { color: var(--text); }

    .launch-toggle-icon {
      font-size: 0.875rem;
      transition: transform 0.2s;
    }

    .launch-toggle-icon.open { transform: rotate(180deg); }

    .launch-form {
      padding: 1rem;
      display: none;
    }

    .launch-form.visible { display: block; }

    .launch-form-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.75rem;
      margin-bottom: 0.875rem;
    }

    @media (min-width: 640px) {
      .launch-form-row { grid-template-columns: 1fr 1fr 1fr; }
    }

    .form-field { display: flex; flex-direction: column; gap: 0.3rem; }

    .form-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-dim);
    }

    .form-input, .form-select {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: inherit;
      font-size: 0.875rem;
      padding: 0.45rem 0.75rem;
      outline: none;
      transition: border-color 0.15s;
      width: 100%;
    }

    .form-input:focus, .form-select:focus { border-color: var(--accent); }
    .form-input::placeholder { color: var(--text-dim); }

    .form-select option { background: var(--card); color: var(--text); }

    .launch-btn {
      background: var(--accent);
      border: none;
      border-radius: var(--radius);
      color: #0d1117;
      font-weight: 600;
      font-size: 0.875rem;
      padding: 0.5rem 1.25rem;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .launch-btn:hover   { opacity: 0.85; }
    .launch-btn:active  { opacity: 0.7;  }
    .launch-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .launch-status {
      font-size: 0.8125rem;
      margin-top: 0.5rem;
      min-height: 1.25rem;
    }

    .launch-status.ok    { color: var(--success); }
    .launch-status.error { color: var(--error); }
  </style>
</head>
<body>
  <header>
    <div class="header-title">
      <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
        <path d="M8 0a8 8 0 1 1 0 16A8 8 0 0 1 8 0ZM1.5 8a6.5 6.5 0 1 0 13 0 6.5 6.5 0 0 0-13 0Zm4.879-2.773 4.264 2.559a.25.25 0 0 1 0 .428l-4.264 2.559A.25.25 0 0 1 6 10.559V5.442a.25.25 0 0 1 .379-.215Z"/>
      </svg>
      Agents UI
    </div>
    <span class="refresh-indicator" id="refresh-indicator" aria-live="polite">Connecting…</span>
  </header>

  <main id="app" role="main">
    <div class="loading-state">
      <div class="spinner" role="status" aria-label="Loading"></div>
      <span>Loading swarm data…</span>
    </div>
  </main>

  <!-- Issue creation modal (hidden by default) -->
  <div id="new-issue-overlay" class="modal-overlay" style="display:none" role="dialog" aria-modal="true" aria-labelledby="new-issue-title">
    <div class="modal">
      <div class="modal-title" id="new-issue-title">Create GitHub Issue</div>
      <div class="modal-row">
        <label class="modal-label" for="ni-title">Title</label>
        <input class="modal-input" id="ni-title" type="text" placeholder="Brief summary of the issue" autocomplete="off" />
      </div>
      <div class="modal-row">
        <label class="modal-label" for="ni-body">Description (optional)</label>
        <textarea class="modal-textarea" id="ni-body" placeholder="Steps to reproduce, expected vs actual behavior…"></textarea>
      </div>
      <div class="modal-row-inline">
        <div class="modal-row">
          <label class="modal-label" for="ni-priority">Priority</label>
          <select class="modal-select" id="ni-priority">
            <option value="P2">P2 — Medium</option>
            <option value="P0">P0 — Critical</option>
            <option value="P1">P1 — High</option>
            <option value="P3">P3 — Low</option>
          </select>
        </div>
        <div class="modal-row">
          <label class="modal-label" for="ni-type">Type</label>
          <select class="modal-select" id="ni-type">
            <option value="bug">Bug</option>
            <option value="enhancement">Enhancement</option>
          </select>
        </div>
      </div>
      <div class="modal-row">
        <div class="modal-label">Extra labels (optional)</div>
        <div class="modal-labels" id="ni-extra-labels">
          <span class="label-toggle" data-label="needs-design" onclick="toggleLabel(this)">needs-design</span>
          <span class="label-toggle" data-label="needs-clarification" onclick="toggleLabel(this)">needs-clarification</span>
          <span class="label-toggle" data-label="needs-approval" onclick="toggleLabel(this)">needs-approval</span>
          <span class="label-toggle" data-label="too-complex" onclick="toggleLabel(this)">too-complex</span>
          <span class="label-toggle" data-label="proposal" onclick="toggleLabel(this)">proposal</span>
          <span class="label-toggle" data-label="future" onclick="toggleLabel(this)">future</span>
        </div>
      </div>
      <div class="modal-status" id="ni-status"></div>
      <div class="modal-actions">
        <button class="modal-cancel" onclick="closeNewIssueModal()">Cancel</button>
        <button class="modal-submit" id="ni-submit" onclick="submitNewIssue()">Create Issue</button>
      </div>
    </div>
  </div>

  <script>
    'use strict';

    // ── State ──────────────────────────────────────────────────────────────────
    const state = {
      swarms:  [],
      project: null,   // selected project_name (Level 2)
      agent:   null,   // selected agent role (Level 3)
      error:   null,
      // session view state
      session: {
        paneContent:  '',
        tmuxTarget:   '',
        agentState:   '',
        sending:      false,
        lastFeedback: null,  // { ok, msg }
        refreshTimer: null,
      },
      // launch form state
      launch: {
        open:       false,
        repos:      [],
        launching:  false,
        status:     null,  // { ok, msg }
        // The 5s refresh loop rebuilds this panel's DOM, so anything typed
        // into it has to live in state or it is wiped on the next tick.
        repoPath:   '',
        agentType:  'Claude',
        numWorkers: 3,
      },
    };

    // ── Helpers ────────────────────────────────────────────────────────────────
    function esc(v) {
      if (v == null) return '';
      return String(v)
        .replace(/&/g,  '&amp;')
        .replace(/</g,  '&lt;')
        .replace(/>/g,  '&gt;')
        .replace(/"/g,  '&quot;')
        .replace(/'/g,  '&#39;');
    }

    // Convert ANSI escape sequences to HTML spans with inline styles.
    // Handles SGR attributes: reset, bold, dim, italic, underline, strikethrough,
    // standard 8/16 colors (30-37, 40-47, 90-97, 100-107), 256-color (38;5;n),
    // and truecolor (38;2;r;g;b). Non-SGR sequences are stripped silently.
    function ansiToHtml(text) {
      if (!text) return '';
      const ANSI16 = [
        '#1a1a1a','#cc4444','#44cc44','#cccc44','#4444cc','#cc44cc','#44cccc','#cccccc',
        '#888888','#ff6666','#66ff66','#ffff66','#6666ff','#ff66ff','#66ffff','#ffffff'
      ];
      function color256(n) {
        if (n < 16) return ANSI16[n];
        if (n < 232) {
          const i = n - 16;
          const b = i % 6, g = Math.floor(i / 6) % 6, r = Math.floor(i / 36);
          return '#' + [r,g,b].map(v => (v ? v*40+55 : 0).toString(16).padStart(2,'0')).join('');
        }
        const v = (n - 232) * 10 + 8;
        const h = v.toString(16).padStart(2,'0');
        return '#' + h + h + h;
      }
      let fg = null, bg = null, bold = false, dim = false, italic = false, ul = false, strike = false;
      function style() {
        const p = [];
        if (fg) p.push('color:' + fg);
        if (bg) p.push('background:' + bg);
        if (bold) p.push('font-weight:bold');
        if (dim)  p.push('opacity:0.6');
        if (italic) p.push('font-style:italic');
        if (ul) p.push('text-decoration:underline');
        if (strike) p.push('text-decoration:line-through');
        return p.join(';');
      }
      function hasStyle() { return fg||bg||bold||dim||italic||ul||strike; }
      function htmlEsc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

      const ESC_RE = /\x1b\[([0-9;]*)m|\x1b\[[\x20-\x3f]*[\x40-\x7e]|\x1b\][^\x07\x1b]*(?:\x07|\x1b\\)|\x1b[@-Z\\-_]|\x1b[^\[]/g;
      let out = '', last = 0, m;
      while ((m = ESC_RE.exec(text)) !== null) {
        if (m.index > last) {
          const chunk = htmlEsc(text.slice(last, m.index));
          out += hasStyle() ? '<span style="' + style() + '">' + chunk + '</span>' : chunk;
        }
        last = m.index + m[0].length;
        if (m[1] !== undefined) {
          const codes = m[1] ? m[1].split(';').map(Number) : [0];
          let i = 0;
          while (i < codes.length) {
            const c = codes[i++];
            if (c === 0)  { fg=null;bg=null;bold=dim=italic=ul=strike=false; }
            else if (c===1) bold=true;
            else if (c===2) dim=true;
            else if (c===3) italic=true;
            else if (c===4) ul=true;
            else if (c===9) strike=true;
            else if (c===22) { bold=dim=false; }
            else if (c===23) italic=false;
            else if (c===24) ul=false;
            else if (c===29) strike=false;
            else if (c===39) fg=null;
            else if (c===49) bg=null;
            else if (c>=30&&c<=37) fg=ANSI16[c-30];
            else if (c>=40&&c<=47) bg=ANSI16[c-40];
            else if (c>=90&&c<=97) fg=ANSI16[c-82];
            else if (c>=100&&c<=107) bg=ANSI16[c-92];
            else if (c===38||c===48) {
              const target = c===38?'fg':'bg';
              if (codes[i]===5 && i+1<codes.length) {
                const col = color256(codes[i+1]); i+=2;
                if (target==='fg') fg=col; else bg=col;
              } else if (codes[i]===2 && i+3<codes.length) {
                const col='rgb('+codes[i+1]+','+codes[i+2]+','+codes[i+3]+')'; i+=4;
                if (target==='fg') fg=col; else bg=col;
              }
            }
          }
        }
      }
      if (last < text.length) {
        const chunk = htmlEsc(text.slice(last));
        out += hasStyle() ? '<span style="' + style() + '">' + chunk + '</span>' : chunk;
      }
      return out;
    }

    function statusClass(stateStr) {
      if (!stateStr) return 'unknown';
      const lower = stateStr.toLowerCase();
      if (lower.startsWith('working'))  return 'working';
      if (lower === 'idle')             return 'idle';
      if (lower === 'stopped')          return 'stopped';
      if (lower === 'starting')         return 'starting';
      return 'unknown';
    }

    // ── Launch panel ──────────────────────────────────────────────────────────
    function renderLaunchPanel() {
      const L = state.launch;
      const iconClass = 'launch-toggle-icon' + (L.open ? ' open' : '');
      const repoOptions = L.repos.map(r =>
        '<option value="' + esc(r.path) + '">' + esc(r.name) + ' — ' + esc(r.path) + '</option>'
      ).join('');

      const statusHtml = L.status
        ? '<div class="alert-row">' +
            '<div class="launch-status ' + (L.status.ok ? 'ok' : 'error') + '" role="status">' +
              esc(L.status.msg) +
            '</div>' +
            '<button class="alert-close" onclick="dismissLaunchStatus()" ' +
                    'aria-label="Dismiss message" title="Dismiss">\u00d7</button>' +
          '</div>'
        : '<div class="launch-status"></div>';

      return (
        '<div class="launch-panel" id="launch-panel">' +
          '<div class="launch-panel-header" onclick="toggleLaunchPanel()" role="button" tabindex="0" ' +
               'aria-expanded="' + L.open + '" aria-controls="launch-form" ' +
               'onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();toggleLaunchPanel()}">' +
            '+ Launch New Swarm' +
            '<span class="' + iconClass + '" aria-hidden="true">▾</span>' +
          '</div>' +
          '<div class="launch-form' + (L.open ? ' visible' : '') + '" id="launch-form">' +
            '<div class="launch-form-row">' +
              '<div class="form-field" style="grid-column:1/-1">' +
                '<label class="form-label" for="launch-repo">Repository path</label>' +
                '<input class="form-input" id="launch-repo" type="text" list="repo-datalist" ' +
                       'value="' + esc(L.repoPath) + '" ' +
                       'oninput="state.launch.repoPath = this.value" ' +
                       'placeholder="/path/to/your/repo" autocomplete="off" />' +
                '<datalist id="repo-datalist">' + repoOptions + '</datalist>' +
              '</div>' +
            '</div>' +
            '<div class="launch-form-row">' +
              '<div class="form-field">' +
                '<label class="form-label" for="launch-agent-type">Agent type</label>' +
                '<select class="form-select" id="launch-agent-type" ' +
                        'onchange="state.launch.agentType = this.value">' +
                  ['Claude', 'Codex', 'Droid', 'Gemini'].map(t =>
                    '<option value="' + t + '"' +
                    (t === L.agentType ? ' selected' : '') + '>' + t + '</option>'
                  ).join('') +
                '</select>' +
              '</div>' +
              '<div class="form-field">' +
                '<label class="form-label" for="launch-workers">Workers</label>' +
                '<input class="form-input" id="launch-workers" type="number" min="1" max="20" ' +
                       'value="' + L.numWorkers + '" ' +
                       'oninput="state.launch.numWorkers = parseInt(this.value, 10) || 1" />' +
              '</div>' +
              '<div class="form-field" style="justify-content:flex-end;padding-top:1.35rem">' +
                '<button class="launch-btn" id="launch-btn" onclick="submitLaunchSwarm()"' +
                  (L.launching ? ' disabled' : '') + '>' +
                  (L.launching ? 'Launching…' : 'Launch') +
                '</button>' +
              '</div>' +
            '</div>' +
            statusHtml +
          '</div>' +
        '</div>'
      );
    }

    function toggleLaunchPanel() {
      state.launch.open = !state.launch.open;
      if (state.launch.open && state.launch.repos.length === 0) {
        fetchRepos().then(repos => {
          state.launch.repos = repos;
          refreshLaunchPanel();
        }).catch(() => {});
      }
      refreshLaunchPanel();
    }

    // Replacing innerHTML destroys whatever element had focus. Without this the
    // 5s refresh loop pulls the caret out of the launch form mid-typing and
    // closes the datalist dropdown, which reads as the field refusing input.
    function preservingFocus(mutate) {
      const active = document.activeElement;
      const id = active && active.id;
      let start = null, end = null;
      // selectionStart throws on input types that do not support selection
      // (number, and some browsers' date inputs), so probing has to be guarded.
      try { start = active.selectionStart; end = active.selectionEnd; } catch (e) {}

      mutate();

      if (!id) return;
      const restored = document.getElementById(id);
      if (!restored || restored === document.activeElement) return;
      restored.focus();
      if (start != null && restored.setSelectionRange) {
        try { restored.setSelectionRange(start, end); } catch (e) {}
      }
    }

    function dismissLaunchStatus() {
      state.launch.status = null;
      refreshLaunchPanel();
    }

    function dismissSessionFeedback() {
      state.session.lastFeedback = null;
      render();
    }

    function refreshLaunchPanel() {
      const container = document.getElementById('launch-panel-container');
      if (container) {
        preservingFocus(() => { container.innerHTML = renderLaunchPanel(); });
      }
    }

    async function fetchRepos() {
      const r = await fetch('/api/repos');
      if (!r.ok) return [];
      const data = await r.json();
      return Array.isArray(data.repos) ? data.repos : [];
    }

    async function submitLaunchSwarm() {
      const repoEl    = document.getElementById('launch-repo');
      const typeEl    = document.getElementById('launch-agent-type');
      const workersEl = document.getElementById('launch-workers');

      if (!repoEl || !typeEl || !workersEl) return;

      // Read through state: the refresh loop can rebuild these elements between
      // the click and this handler running, and state is the durable copy.
      const repoPath   = (state.launch.repoPath || repoEl.value).trim();
      const agentType  = state.launch.agentType || typeEl.value;
      const numWorkers = state.launch.numWorkers || parseInt(workersEl.value, 10) || 3;

      if (!repoPath) {
        state.launch.status = { ok: false, msg: 'Please enter a repository path.' };
        refreshLaunchPanel();
        return;
      }

      state.launch.launching = true;
      state.launch.status    = null;
      refreshLaunchPanel();

      try {
        const r = await fetch('/api/swarms', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ repo_path: repoPath, agent_type: agentType, num_workers: numWorkers }),
        });
        const data = await r.json();
        if (r.ok && data.ok) {
          state.launch.status = { ok: true, msg: 'Swarm launching for ' + (data.project_name || repoPath) + '! Refresh in a few seconds.' };
          state.launch.repoPath = '';
          // Refresh swarms after a short delay to pick up the new swarm
          setTimeout(() => { refresh(); }, 4000);
        } else {
          state.launch.status = { ok: false, msg: 'Launch failed (HTTP ' + r.status + ')' };
        }
      } catch (err) {
        state.launch.status = { ok: false, msg: 'Error: ' + err.message };
      } finally {
        state.launch.launching = false;
        refreshLaunchPanel();
      }
    }

    async function stopSwarm(project) {
      if (!confirm('Stop all workers in ' + project + '?')) return;
      try {
        const r = await fetch('/api/swarms/' + encodeURIComponent(project), { method: 'DELETE' });
        if (r.ok) {
          setTimeout(() => { refresh(); }, 1500);
        } else {
          alert('Stop failed (HTTP ' + r.status + ')');
        }
      } catch (err) {
        alert('Error: ' + err.message);
      }
    }

    // Per-swarm agent type override (set by the agent-type switcher, null = use swarm default).
    const swarmAgentTypeOverride = {};

    async function addWorker(project) {
      try {
        const override = swarmAgentTypeOverride[project];
        const fetchOpts = override
          ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ agent_type: override }) }
          : { method: 'POST' };
        const r = await fetch('/api/swarms/' + encodeURIComponent(project) + '/workers', fetchOpts);
        if (r.ok) {
          setTimeout(() => { refresh(); }, 4000);
        } else {
          alert('Add worker failed (HTTP ' + r.status + ')');
        }
      } catch (err) {
        alert('Error: ' + err.message);
      }
    }

    async function switchAgentType(project, type) {
      swarmAgentTypeOverride[project] = type;
      // Re-render immediately for visual feedback.
      const swarm = state.swarms.find(s => s.project_name === project);
      if (swarm) render();
      // Also call the API to persist the change.
      try {
        const r = await fetch('/api/swarms/' + encodeURIComponent(project), {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ agent_type: type }),
        });
        if (!r.ok) {
          alert('Switch agent failed (HTTP ' + r.status + ')');
        } else {
          setTimeout(() => { refresh(); }, 5000);
        }
      } catch (err) {
        alert('Error: ' + err.message);
      }
    }

    async function startSwarm(repoPath, agentType, numWorkers) {
      try {
        const r = await fetch('/api/swarms', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ repo_path: repoPath, agent_type: agentType, num_workers: numWorkers || 2 }),
        });
        if (r.ok) {
          setTimeout(() => { refresh(); }, 4000);
        } else {
          alert('Start failed (HTTP ' + r.status + ')');
        }
      } catch (err) {
        alert('Error: ' + err.message);
      }
    }

    // ── API ────────────────────────────────────────────────────────────────────
    async function fetchSwarms() {
      const r = await fetch('/api/swarms');
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const data = await r.json();
      return Array.isArray(data.swarms) ? data.swarms : [];
    }

    async function fetchPane(project, role) {
      const r = await fetch('/api/swarms/' + encodeURIComponent(project) + '/agents/' + encodeURIComponent(role) + '/pane');
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }

    async function sendInput(project, role, text, enter) {
      const r = await fetch(
        '/api/swarms/' + encodeURIComponent(project) + '/agents/' + encodeURIComponent(role) + '/input',
        {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ text, enter: enter !== false }),
        }
      );
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }

    // Send one raw key, with no Enter appended.
    //
    // The /input endpoint always appends Enter, which cannot drive an
    // interactive picker: an agent sitting on an arrow-key menu (/model,
    // /plugin, a numbered prompt) could not be answered from here at all.
    async function sendKey(project, role, key) {
      const r = await fetch(
        '/api/swarms/' + encodeURIComponent(project) + '/agents/' + encodeURIComponent(role) + '/key',
        {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ key }),
        }
      );
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }

    async function pressKey(key) {
      if (!state.project || !state.agent) return;
      try {
        await sendKey(state.project, state.agent, key);
        // Give the agent a moment to redraw before re-reading the pane.
        setTimeout(refreshSessionPane, 150);
      } catch (err) {
        state.session.lastFeedback = { ok: false, msg: 'Key failed: ' + err.message };
        render();
      }
    }

    // Map a browser KeyboardEvent to a tmux key name. Returns null for keys
    // that should be left to the browser.
    function browserKeyToTmux(e) {
      if (e.ctrlKey && /^[a-z]$/i.test(e.key)) return 'C-' + e.key.toLowerCase();
      switch (e.key) {
        case 'ArrowUp':    return 'Up';
        case 'ArrowDown':  return 'Down';
        case 'ArrowLeft':  return 'Left';
        case 'ArrowRight': return 'Right';
        case 'Enter':      return 'Enter';
        case 'Escape':     return 'Escape';
        case 'Tab':        return e.shiftKey ? 'BTab' : 'Tab';
        case 'Backspace':  return 'BSpace';
        case 'PageUp':     return 'PageUp';
        case 'PageDown':   return 'PageDown';
        case 'Home':       return 'Home';
        case 'End':        return 'End';
        default:           return null;
      }
    }

    // Send one character as literal text, with no Enter.
    //
    // Streaming characters is what makes the agent's own completions work:
    // typing "/autocoder:" only offers skill names if the agent sees the
    // keystrokes arrive one at a time. Reproducing that menu in this page
    // would mean duplicating a list that lives in the agent and goes stale.
    async function typeLiteral(ch) {
      if (!state.project || !state.agent) return;
      try {
        await sendInput(state.project, state.agent, ch, false);
        setTimeout(refreshSessionPane, 120);
      } catch (err) {
        state.session.lastFeedback = { ok: false, msg: 'Send failed: ' + err.message };
        render();
      }
    }

    // Keys pressed while the pane itself has focus go to the agent, so the
    // pane behaves like a terminal. The text box keeps normal editing
    // behaviour -- arrows there move the caret.
    function onTerminalKeyDown(e) {
      // Leave browser/OS shortcuts alone.
      if (e.metaKey) return;

      const key = browserKeyToTmux(e);
      if (key) {
        e.preventDefault();
        pressKey(key);
        return;
      }

      // Printable characters, including '/' and ':'.
      if (!e.ctrlKey && !e.altKey && e.key.length === 1) {
        e.preventDefault();
        typeLiteral(e.key);
      }
    }

    // ── Renderers ──────────────────────────────────────────────────────────────
    function formatIssueInfo(agent) {
      if (!agent.current_issue) return '';
      return ' · #' + agent.current_issue +
        (agent.current_issue_title ? ' ' + agent.current_issue_title : '');
    }

    function healthIcon(h) {
      switch (h) {
        case 'Healthy':    return '<span class="health-icon health-ok" title="Healthy">✓</span>';
        case 'Stalled':    return '<span class="health-icon health-warn" title="Stalled">⚠</span>';
        case 'Restarting': return '<span class="health-icon health-restart" title="Restarting">↺</span>';
        case 'Dead':       return '<span class="health-icon health-dead" title="Dead">✗</span>';
        default:           return '';
      }
    }

    function renderAgentRow(agent, project) {
      const cls      = statusClass(agent.state);
      const issueText = formatIssueInfo(agent);
      const waitText  = agent.waiting_for_input
        ? '<span class="needs-input"> · ⚠ Needs input</span>'
        : '';
      const proj = project || '';
      // Health + stats only shown for workers (managers don't have health tracking)
      const healthHtml = !agent.is_manager ? healthIcon(agent.health || 'Healthy') : '';
      const completedHtml = (!agent.is_manager && agent.completed_issue_count > 0)
        ? '<span class="agent-completed" title="Issues completed this session"> · ✔' + agent.completed_issue_count + '</span>'
        : '';
      const restartHtml = (!agent.is_manager && agent.resurrection_attempts > 0)
        ? '<span class="agent-restarts" title="Auto-restart count"> · ↺' + agent.resurrection_attempts + '</span>'
        : '';
      // Worktree shown as its final path component: the absolute path is
      // identical across agents up to the suffix, so the full form only pushes
      // the useful part off the row. The full path stays available on hover.
      const wtName = agent.worktree_path
        ? agent.worktree_path.split('/').filter(Boolean).pop()
        : '';
      const worktreeHtml = wtName
        ? '<span class="agent-worktree" title="' + esc(agent.worktree_path) + '"> · ' + esc(wtName) + '</span>'
        : '';
      const branchHtml = agent.branch
        ? '<span class="agent-branch" title="Checked-out branch"> · ⎇ ' + esc(agent.branch) + '</span>'
        : '';
      return (
        '<div class="agent-row" ' +
             'role="button" tabindex="0" ' +
             'aria-label="Open session for ' + esc(agent.role) + '" ' +
             'onclick="openSession(\'' + esc(proj) + '\',\'' + esc(agent.role) + '\')" ' +
             'onkeydown="if(event.key===\'Enter\'||(event.key===\' \'&&(event.preventDefault(),true))){openSession(\'' + esc(proj) + '\',\'' + esc(agent.role) + '\')}">' +
          '<span class="status-dot s-' + cls + '" aria-hidden="true"></span>' +
          '<div class="agent-info">' +
            '<div class="agent-role">' + healthHtml + ' ' + esc(agent.role) + '</div>' +
            '<div class="agent-state-text">' +
              esc(agent.state) + esc(issueText) + worktreeHtml + branchHtml +
              waitText + completedHtml + restartHtml +
            '</div>' +
          '</div>' +
          '<span class="agent-row-arrow" aria-hidden="true">›</span>' +
        '</div>'
      );
    }

    function renderDetailView(swarm) {
      const workers    = swarm.workers || [];
      const workerRows = workers.length
        ? workers.map(a => renderAgentRow(a, swarm.project_name)).join('')
        : '<div class="empty-state">No workers</div>';

      const stoppedBadge = swarm.stopped
        ? ' <span class="stopped-badge">(stopped)</span>'
        : '';

      return (
        '<nav class="breadcrumb" aria-label="Breadcrumb">' +
          '<button class="crumb-link" onclick="navigate(null)">Repos</button>' +
          '<span class="crumb-sep" aria-hidden="true">›</span>' +
          '<span class="crumb-current">' + esc(swarm.project_name) + '</span>' +
        '</nav>' +

        '<div class="detail-title">' + esc(swarm.project_name) + stoppedBadge + '</div>' +
        '<div class="detail-meta">' +
          '<span class="meta-item">' + esc(swarm.agent_type) + '</span>' +
          (swarm.workflow ? '<span class="meta-item">' + esc(swarm.workflow) + '</span>' : '') +
          '<span class="meta-item" style="font-family:monospace;font-size:0.75rem">' + esc(swarm.tmux_session) + '</span>' +
          '<span class="meta-item" style="opacity:0.7">' + esc(swarm.repo_path) + '</span>' +
        '</div>' +
        (function() {
          const proj = swarm.project_name;
          const activeType = swarmAgentTypeOverride[proj] || swarm.agent_type;
          const agentTypeSelector = '<select class="agent-type-select" ' +
            'aria-label="Agent type for next worker" ' +
            'onchange="switchAgentType(' + JSON.stringify(proj) + ',this.value)">' +
            ['Claude','Codex','Droid','Gemini'].map(t =>
              '<option value="' + t + '"' + (t === activeType ? ' selected' : '') + '>' + t + '</option>'
            ).join('') +
            '</select>';
          return '<div class="action-bar">' +
            (swarm.stopped
              ? '<button class="action-btn start-btn" onclick="startSwarm(' + JSON.stringify(swarm.repo_path) + ',' + JSON.stringify(swarm.agent_type) + ',' + swarm.workers.length + ')">▶ Start</button>'
              : '<button class="action-btn stop-btn" onclick="stopSwarm(' + JSON.stringify(proj) + ')">■ Stop</button>' +
                agentTypeSelector +
                '<button class="action-btn add-worker-btn" onclick="addWorker(' + JSON.stringify(proj) + ')">+ Add Worker</button>'
            ) +
            '<button class="action-btn new-issue-btn" onclick="openNewIssueModal(' + JSON.stringify(proj) + ')">+ New Issue</button>' +
          '</div>';
        })() +

        '<div class="detail-layout">' +
          '<div class="panel">' +
            '<div class="panel-header">Manager</div>' +
            '<div class="agent-list">' + renderAgentRow(swarm.manager, swarm.project_name) + '</div>' +
          '</div>' +
          '<div class="panel">' +
            '<div class="panel-header">' +
              'Workers' +
              '<span class="panel-count">' + workers.length + '</span>' +
            '</div>' +
            '<div class="agent-list">' + workerRows + '</div>' +
          '</div>' +
        '</div>' +

        renderIssuesPanel(swarm.issues || [])
      );
    }

    function renderIssuesPanel(issues) {
      if (!issues || issues.length === 0) return '';

      // Sort: blocked last, then by priority (lower number = higher priority), then by number
      const sorted = issues.slice().sort((a, b) => {
        const aBlocked = a.is_blocked ? 1 : 0;
        const bBlocked = b.is_blocked ? 1 : 0;
        if (aBlocked !== bBlocked) return aBlocked - bBlocked;
        const aPri = a.priority === '—' ? 9 : parseInt(a.priority.slice(1)) || 9;
        const bPri = b.priority === '—' ? 9 : parseInt(b.priority.slice(1)) || 9;
        if (aPri !== bPri) return aPri - bPri;
        return a.number - b.number;
      });

      const rows = sorted.map(issue => {
        const rowCls = issue.is_blocked ? 'issue-row issue-blocked'
                     : issue.is_working ? 'issue-row issue-working'
                     : 'issue-row';
        const statusText = issue.is_blocked ? '⚠ blocked'
                         : issue.is_working ? ('🔨 ' + (issue.assigned_worker || 'working'))
                         : '—';
        return (
          '<tr class="' + rowCls + '">' +
            '<td class="issue-num"><a href="' + esc(issue.url) + '" target="_blank" rel="noopener">#' + issue.number + '</a></td>' +
            '<td class="issue-title">' + esc(issue.title) + '</td>' +
            '<td class="issue-pri">' + esc(issue.priority) + '</td>' +
            '<td class="issue-status">' + esc(statusText) + '</td>' +
          '</tr>'
        );
      }).join('');

      return (
        '<div class="panel issues-panel">' +
          '<div class="panel-header">Open Issues <span class="panel-count">' + issues.length + '</span></div>' +
          '<table class="issues-table">' +
            '<thead><tr>' +
              '<th>#</th><th>Title</th><th>Priority</th><th>Status</th>' +
            '</tr></thead>' +
            '<tbody>' + rows + '</tbody>' +
          '</table>' +
        '</div>'
      );
    }

    function renderSessionView(project, role) {
      const s    = state.session;
      const cls  = statusClass(s.agentState);
      const feedbackHtml = s.lastFeedback
        ? '<div class="alert-row">' +
            '<p class="send-feedback ' + (s.lastFeedback.ok ? 'ok' : 'error') + '" role="status">' +
              esc(s.lastFeedback.msg) +
            '</p>' +
            '<button class="alert-close" onclick="dismissSessionFeedback()" ' +
                    'aria-label="Dismiss message" title="Dismiss">\u00d7</button>' +
          '</div>'
        : '<p class="send-feedback"></p>';

      return (
        '<nav class="breadcrumb" aria-label="Breadcrumb">' +
          '<button class="crumb-link" onclick="navigate(null)">Repos</button>' +
          '<span class="crumb-sep" aria-hidden="true">›</span>' +
          '<button class="crumb-link" onclick="navigate(\'' + esc(project) + '\')">' + esc(project) + '</button>' +
          '<span class="crumb-sep" aria-hidden="true">›</span>' +
          '<span class="crumb-current">' + esc(role) + '</span>' +
        '</nav>' +

        '<div class="session-header">' +
          '<span class="status-dot s-' + cls + '" aria-hidden="true"></span>' +
          '<span class="session-title">' + esc(role) + '</span>' +
          '<span class="session-target">' + esc(s.tmuxTarget) + '</span>' +
          '<span style="font-size:0.8125rem;color:var(--text-dim);margin-left:auto">' + esc(s.agentState) + '</span>' +
        '</div>' +

        '<div class="terminal-wrap">' +
          '<div class="terminal-toolbar">' +
            '<span>pane output</span>' +
            '<button onclick="refreshSessionPane()" aria-label="Refresh pane">↺ Refresh</button>' +
          '</div>' +
          '<div class="terminal-output" id="terminal-output" tabindex="0" ' +
               'role="application" aria-label="Agent pane. Focus here to send keys directly." ' +
               'onkeydown="onTerminalKeyDown(event)">' + ansiToHtml(s.paneContent) + '</div>' +
        '</div>' +

        '<div class="key-row">' +
          '<span class="key-row-label">Keys</span>' +
          [['Up','\u2191'], ['Down','\u2193'], ['Left','\u2190'], ['Right','\u2192'],
           ['Enter','Enter'], ['Escape','Esc'], ['Tab','Tab'], ['C-c','Ctrl-C']]
            .map(([key, label]) =>
              '<button class="key-btn" onclick="pressKey(\'' + key + '\')" ' +
                      'aria-label="Send ' + key + '">' + label + '</button>'
            ).join('') +
          '<span class="key-hint">or click the pane and type \u2014 completions work there</span>' +
        '</div>' +

        '<div class="input-row">' +
          '<input class="session-input" id="session-input" type="text" ' +
                 'placeholder="Type a command and press Enter or Send…" ' +
                 'onkeydown="if(event.key===\'Enter\'){event.preventDefault();submitSessionInput()}" ' +
                 'autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />' +
          '<button class="send-btn" id="send-btn" onclick="submitSessionInput()" ' +
                  (s.sending ? 'disabled' : '') + '>' +
            (s.sending ? '…' : 'Send') +
          '</button>' +
        '</div>' +
        feedbackHtml
      );
    }

    // One agent -> one dot colour. Ordered by what the viewer needs to act on:
    // a dead agent outranks a blocked one, and a blocked one outranks whatever
    // its state field claims, because an agent waiting at a prompt still
    // reports itself as Working.
    function agentDotClass(agent) {
      const health = agent.health || 'Healthy';
      if (health === 'Dead' || health === 'Stalled') return 'dot-stuck';
      if (agent.waiting_for_input)                   return 'dot-waiting';

      const state = String(agent.state || '').toLowerCase();
      if (state.startsWith('working') || state === 'starting') return 'dot-active';
      if (state === 'stopped' || state.startsWith('missing'))  return 'dot-stuck';
      return 'dot-idle';
    }

    function agentDotTitle(agent) {
      const bits = [agent.role, agent.state];
      if (agent.waiting_for_input) bits.push('needs input');
      if (agent.health && agent.health !== 'Healthy') bits.push(agent.health);
      if (agent.current_issue) bits.push('#' + agent.current_issue);
      return bits.filter(Boolean).join(' · ');
    }

    function renderAgentDots(swarm) {
      const agents = [swarm.manager].concat(swarm.workers || []).filter(Boolean);
      if (!agents.length) {
        return '<div class="agent-dots"><span class="agent-dots-empty">No agents</span></div>';
      }

      const dots = agents.map(a =>
        '<span class="agent-dot ' + agentDotClass(a) +
               (a.is_manager ? ' is-manager' : '') + '" ' +
              'title="' + esc(agentDotTitle(a)) + '"></span>'
      ).join('');

      return '<div class="agent-dots" role="img" ' +
                  'aria-label="' + esc(agents.length + ' agents: ' +
                    agents.map(agentDotTitle).join('; ')) + '">' +
               dots +
             '</div>';
    }

    function renderSwarmCard(swarm) {
      // One dot per agent replaces the busy/idle/attention counters: the dots
      // carry the same totals, but also say which agent is in which state, and
      // stay readable at a glance as the worker count grows.
      const stoppedClass = swarm.stopped ? ' stopped' : '';

      return (
        '<div class="swarm-card' + stoppedClass + '" ' +
             'role="button" tabindex="0" ' +
             'aria-label="View swarm ' + esc(swarm.project_name) + '" ' +
             'onclick="navigate(\'' + esc(swarm.project_name) + '\')" ' +
             'onkeydown="if(event.key===\'Enter\'||(event.key===\' \'&&(event.preventDefault(),true))){navigate(\'' + esc(swarm.project_name) + '\')}">' +
          '<div class="card-header">' +
            '<div class="project-name">' + esc(swarm.project_name) + '</div>' +
            '<span class="badge">' + esc(swarm.agent_type) + '</span>' +
          '</div>' +
          '<div class="card-path">' + esc(swarm.repo_path) + '</div>' +
          renderAgentDots(swarm) +
        '</div>'
      );
    }

    function renderReposList() {
      const swarms = state.swarms;
      const launchHtml = '<div id="launch-panel-container">' + renderLaunchPanel() + '</div>';
      if (!swarms.length) {
        return (
          launchHtml +
          '<div class="empty-state">' +
            '<p>No active swarms.</p>' +
            '<p class="empty-hint">Launch a swarm using the panel above, or start <code>agents-tui</code>.</p>' +
          '</div>'
        );
      }
      return (
        launchHtml +
        '<p class="section-heading">' + swarms.length + ' Swarm' + (swarms.length !== 1 ? 's' : '') + '</p>' +
        '<div class="swarms-grid">' + swarms.map(renderSwarmCard).join('') + '</div>'
      );
    }

    // ── Render dispatcher ──────────────────────────────────────────────────────
    function render() {
      const app = document.getElementById('app');
      if (state.error && !state.swarms.length) {
        app.innerHTML =
          '<div class="error-banner">Could not reach API: ' + esc(state.error) + '</div>' +
          renderReposList();
        return;
      }

      if (state.agent && state.project) {
        app.innerHTML = renderSessionView(state.project, state.agent);
        // Scroll terminal to bottom
        const t = document.getElementById('terminal-output');
        if (t) t.scrollTop = t.scrollHeight;
        // Focus the input
        const inp = document.getElementById('session-input');
        if (inp && document.activeElement !== inp) inp.focus();
        return;
      }

      if (state.project) {
        const swarm = state.swarms.find(s => s.project_name === state.project);
        if (swarm) {
          app.innerHTML = renderDetailView(swarm);
          return;
        }
        state.project = null;
      }

      preservingFocus(() => { app.innerHTML = renderReposList(); });
    }

    // ── Navigation ─────────────────────────────────────────────────────────────
    function navigate(projectName) {
      // Stop any session pane-refresh timer before leaving
      stopSessionRefresh();
      state.project = projectName;
      state.agent   = null;
      render();
      window.scrollTo(0, 0);
    }

    function openSession(project, role) {
      stopSessionRefresh();
      state.project = project;
      state.agent   = role;
      state.session = {
        paneContent:  'Loading…',
        tmuxTarget:   '',
        agentState:   '',
        sending:      false,
        lastFeedback: null,
        refreshTimer: null,
      };
      render();
      window.scrollTo(0, 0);
      // Load initial pane content then start refresh loop
      refreshSessionPane();
    }

    // ── Session pane refresh ───────────────────────────────────────────────────
    function stopSessionRefresh() {
      if (state.session.refreshTimer !== null) {
        clearInterval(state.session.refreshTimer);
        state.session.refreshTimer = null;
      }
    }

    async function refreshSessionPane() {
      if (!state.project || !state.agent) return;
      try {
        const data = await fetchPane(state.project, state.agent);
        state.session.paneContent = data.pane_content || '';
        state.session.tmuxTarget  = data.tmux_target  || '';
        state.session.agentState  = data.state        || '';
        // Update DOM directly to avoid re-rendering the whole view (which would
        // clear the input field and reset focus).
        const t = document.getElementById('terminal-output');
        if (t) {
          const wasAtBottom = t.scrollHeight - t.scrollTop <= t.clientHeight + 20;
          t.innerHTML = ansiToHtml(state.session.paneContent);
          if (wasAtBottom) t.scrollTop = t.scrollHeight;
        }
        // Update status in session header if visible
        const hdr = document.querySelector('.session-header .s-' + statusClass(state.session.agentState));
        // Update the target label & state text without full re-render
        const targetEl = document.querySelector('.session-target');
        if (targetEl) targetEl.textContent = state.session.tmuxTarget;
        const stateEl = document.querySelector('.session-header span:last-child');
        if (stateEl) stateEl.textContent = state.session.agentState;
      } catch (err) {
        // Non-fatal; just leave stale content
        traceSessionError(err);
      }
      // Start periodic refresh if not already running
      if (state.session.refreshTimer === null && state.agent) {
        state.session.refreshTimer = setInterval(refreshSessionPane, 2000);
      }
    }

    function traceSessionError(err) {
      // Suppress noisy errors when navigating away; only log in session context
      if (state.agent) {
        const t = document.getElementById('terminal-output');
        if (t && t.textContent === 'Loading…') {
          t.textContent = 'Could not load pane: ' + err.message;
        }
      }
    }

    // ── Send input ─────────────────────────────────────────────────────────────
    async function submitSessionInput() {
      const inp = document.getElementById('session-input');
      if (!inp) return;
      const text = inp.value.trim();
      if (!text) return;

      state.session.sending      = true;
      state.session.lastFeedback = null;
      const btn = document.getElementById('send-btn');
      if (btn) { btn.disabled = true; btn.textContent = '…'; }

      try {
        await sendInput(state.project, state.agent, text);
        inp.value = '';
        state.session.lastFeedback = { ok: true, msg: 'Sent ✓' };
        // Refresh pane immediately after sending
        await refreshSessionPane();
      } catch (err) {
        state.session.lastFeedback = { ok: false, msg: 'Error: ' + err.message };
      } finally {
        state.session.sending = false;
        if (btn) { btn.disabled = false; btn.textContent = 'Send'; }
        // Update feedback display without full re-render
        const fb = document.querySelector('.send-feedback');
        if (fb && state.session.lastFeedback) {
          fb.className = 'send-feedback ' + (state.session.lastFeedback.ok ? 'ok' : 'error');
          fb.textContent = state.session.lastFeedback.msg;
          setTimeout(() => {
            if (fb) { fb.className = 'send-feedback'; fb.textContent = ''; }
          }, 3000);
        }
        inp.focus();
      }
    }

    // ── Swarms refresh loop ────────────────────────────────────────────────────
    async function refresh() {
      const ind = document.getElementById('refresh-indicator');
      try {
        state.swarms = await fetchSwarms();
        state.error  = null;
        const t = new Date();
        ind.textContent = 'Updated ' + t.toLocaleTimeString();
      } catch (err) {
        state.error = err.message;
        ind.textContent = 'Error: ' + err.message;
      }
      // Only re-render repos/detail levels; session view does its own live updates
      if (!state.agent) {
        render();
      }
    }

    // ── Issue creation modal ──────────────────────────────────────────────────
    let newIssueProject = null;

    function openNewIssueModal(project) {
      newIssueProject = project;
      document.getElementById('ni-title').value = '';
      document.getElementById('ni-body').value = '';
      document.getElementById('ni-priority').value = 'P2';
      document.getElementById('ni-type').value = 'bug';
      document.querySelectorAll('#ni-extra-labels .label-toggle').forEach(t => t.classList.remove('active'));
      document.getElementById('ni-status').textContent = '';
      document.getElementById('ni-status').className = 'modal-status';
      document.getElementById('ni-submit').disabled = false;
      document.getElementById('new-issue-overlay').style.display = 'flex';
      setTimeout(() => document.getElementById('ni-title').focus(), 50);
    }

    function closeNewIssueModal() {
      document.getElementById('new-issue-overlay').style.display = 'none';
      newIssueProject = null;
    }

    function toggleLabel(el) {
      el.classList.toggle('active');
    }

    async function submitNewIssue() {
      const title    = document.getElementById('ni-title').value.trim();
      const body     = document.getElementById('ni-body').value.trim();
      const priority = document.getElementById('ni-priority').value;
      const type     = document.getElementById('ni-type').value;
      const extraLabels = Array.from(document.querySelectorAll('#ni-extra-labels .label-toggle.active'))
                              .map(t => t.dataset.label);

      if (!title) {
        const st = document.getElementById('ni-status');
        st.textContent = 'Title is required.';
        st.className = 'modal-status error';
        return;
      }

      const labels = [priority, type, ...extraLabels].join(',');
      // Escape single quotes in title/body for shell safety
      const safeTitle = title.replace(/'/g, "'\\''");
      const safeBody  = body  ? body.replace(/'/g, "'\\''") : '';
      const cmd = safeBody
        ? `gh issue create --title '${safeTitle}' --body '${safeBody}' --label '${labels}'`
        : `gh issue create --title '${safeTitle}' --label '${labels}'`;

      const submitBtn = document.getElementById('ni-submit');
      const st = document.getElementById('ni-status');
      submitBtn.disabled = true;
      st.textContent = 'Creating issue…';
      st.className = 'modal-status';

      try {
        const r = await fetch(
          '/api/swarms/' + encodeURIComponent(newIssueProject) + '/agents/manager/input',
          {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: cmd }),
          }
        );
        if (!r.ok) {
          st.textContent = 'Failed to send command (HTTP ' + r.status + ')';
          st.className = 'modal-status error';
          submitBtn.disabled = false;
          return;
        }
        st.textContent = '✓ Command sent to manager. Check the session pane for the result.';
        st.className = 'modal-status ok';
        setTimeout(closeNewIssueModal, 2000);
      } catch (e) {
        st.textContent = 'Error: ' + e.message;
        st.className = 'modal-status error';
        submitBtn.disabled = false;
      }
    }

    // Close modal on overlay click
    document.getElementById('new-issue-overlay').addEventListener('click', function(e) {
      if (e.target === this) closeNewIssueModal();
    });
    // Close modal on Escape
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && document.getElementById('new-issue-overlay').style.display !== 'none') {
        closeNewIssueModal();
      }
    });

    refresh();
    setInterval(refresh, 5000);
  </script>
</body>
</html>
