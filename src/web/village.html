<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Worktree Hollow</title>
<style>
  /* SNES-style menu windows around a pixel-art canvas. One dark look on purpose. */
  :root {
    color-scheme: dark;
    --night: #0c1028;
    --win-top: #2c44a8;
    --win-bot: #101850;
    --win-inner: #6878c8;
    --frame: #f8f8f8;
    --frame-shadow: #060814;
    --rule: #2a3470;
    --ink: #eef0fa;
    --ink-dim: #a8b0d8;
    --gold: #f8d040;
    --orange: #f07020;
    --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--night); color: var(--ink); font: 14px/1.5 var(--sans); }
  body { padding: 12px max(12px, env(safe-area-inset-right)) 24px max(12px, env(safe-area-inset-left)); }
  a { color: var(--ink-dim); }
  .bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; margin: 0 auto 10px; max-width: 1400px; }
  .title { font: 700 16px/1.2 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--gold); display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; min-width: 0; }
  .title select { max-width: 100%; }
  .title a { font-weight: 400; font-size: 12px; text-transform: none; letter-spacing: 0; }
  select { background: var(--win-bot); color: var(--ink); border: 2px solid var(--win-inner); border-radius: 4px; font: 13px var(--mono); padding: 4px 6px; }
  .status { font: 12px var(--mono); color: var(--ink-dim); }
  .vname { color: var(--ink); text-transform: none; letter-spacing: 0; overflow-wrap: anywhere; }
  .vname[hidden], .title a[hidden] { display: none; }
  .zoom { display: inline-flex; gap: 2px; }
  .zoom button { background: var(--win-bot); color: var(--ink); border: 2px solid var(--win-inner); border-radius: 4px; font: 700 13px var(--mono); min-width: 30px; padding: 2px 6px; cursor: pointer; }
  .zoom button:disabled { opacity: .5; cursor: default; }
  .win {
    background: linear-gradient(180deg, var(--win-top), var(--win-bot));
    border: 3px solid var(--frame); border-radius: 6px;
    box-shadow: 0 0 0 3px var(--frame-shadow), inset 0 0 0 2px var(--win-inner);
  }
  .stage { max-width: 1400px; margin: 0 auto; padding: 8px; }
  /* `safe center`: a zoomed-in map scrolls from its left edge instead of being cut off. */
  .viewport { overflow: auto; display: flex; justify-content: safe center; background: var(--frame-shadow); border-radius: 2px; min-height: 200px; align-items: safe center; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; cursor: pointer; }
  .flow { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .step { flex: 1 1 90px; padding: 6px 8px; background: rgba(6,8,20,.45); border: 2px solid var(--rule); border-radius: 4px; }
  .step b { display: block; font: 700 18px/1.1 var(--mono); font-variant-numeric: tabular-nums; }
  .step span { font: 12px var(--mono); color: var(--ink-dim); }
  .empty { padding: 48px 16px; text-align: center; color: var(--ink-dim); font: 14px var(--mono); }
  .dialog { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); width: min(560px, calc(100vw - 32px)); padding: 14px 16px; z-index: 10; }
  .dialog h2 { margin: 0 0 4px; font: 700 14px var(--mono); color: var(--gold); letter-spacing: .04em; }
  .dialog p { margin: 4px 0; font: 15px/1.4 var(--mono); }
  .dialog .dim { color: var(--ink-dim); font-size: 13px; }
  .dialog .links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .dialog .links a { font: 700 13px var(--mono); color: #241400; background: var(--gold); border-radius: 4px; padding: 5px 10px; text-decoration: none; }
  .dialog .links a:hover { filter: brightness(1.1); }
  .dialog ul { list-style: none; margin: 6px 0 0; padding: 0; max-height: 40vh; overflow: auto; }
  .dialog li { font: 14px/1.5 var(--mono); }
  .dialog li a { color: var(--gold); }
  .dialog .q { font: 700 15px/1.4 var(--mono); color: var(--ink); margin: 10px 0 6px; }
  .dialog .opts { display: flex; flex-wrap: wrap; gap: 8px; }
  .dialog .opts button { position: static; font: 700 14px var(--mono); color: var(--ink); background: var(--win-bot); border: 2px solid var(--gold); border-radius: 4px; padding: 6px 12px; cursor: pointer; }
  .dialog .opts button:hover:not(:disabled) { background: var(--gold); color: #241400; }
  .dialog .opts button:disabled { opacity: .5; cursor: default; }
  .dialog button { position: absolute; top: 8px; right: 10px; background: none; border: 0; color: var(--ink); font: 700 16px var(--mono); cursor: pointer; }
  :focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  /* Features: a label under each banner (a real button, so Tab reaches it),
   * and the strip above the counters for the feature being followed. */
  .viewport { position: relative; }
  .fbanners { position: absolute; inset: 0; pointer-events: none; }
  .fb { position: absolute; transform: translateX(-50%); pointer-events: auto; max-width: 118px; font: 700 11px/1.25 var(--mono); color: var(--ink); background: rgba(6,8,20,.82); border: 2px solid var(--fc); border-radius: 4px; padding: 2px 6px; cursor: pointer; text-align: center; }
  .fb small { display: block; font-weight: 400; color: var(--ink-dim); }
  .fb[aria-pressed="true"] { background: var(--fc); color: #0c1028; }
  .fb[aria-pressed="true"] small { color: #0c1028; }
  .fb.live { border-color: var(--gold); }
  .fb.stuck small { color: #ff8070; }
  .fb.stuck[aria-pressed="true"] small { color: #600; }
  /* Area names: a banner over each part of the map, and the worktree under each
   * house. Pointer-transparent, so clicks still reach the map beneath. */
  .alabels { position: absolute; inset: 0; pointer-events: none; }
  .alabels[hidden] { display: none; }
  /* Keyboard targets: one invisible button over each object on the map, so
   * Tab reaches what a click does. The mouse still goes to the map. */
  .hitkeys { position: absolute; inset: 0; pointer-events: none; }
  .hk { position: absolute; pointer-events: none; padding: 0; margin: 0; border: 0; background: none; opacity: 0; }
  .hk:focus-visible { opacity: 1; outline: 3px solid var(--gold); outline-offset: 1px; }
  .al { position: absolute; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font: 700 11px/1.2 var(--mono); color: var(--gold); background: rgba(6,8,20,.78); border: 1px solid var(--gold); border-radius: 3px; padding: 1px 5px; }
  .al small { font-weight: 400; color: var(--ink-dim); }
  .al.house { font-size: 10px; color: var(--ink); border-color: var(--win-inner); padding: 0 3px; }
  .al.house.working { border-color: #38c848; }
  .al.house.blocked { border-color: #e02828; }
  .labels-toggle { font: 13px var(--mono); color: var(--ink-dim); white-space: nowrap; }
  .fstrip { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin-top: 8px; padding: 6px 8px; border: 2px solid var(--fc, var(--rule)); border-radius: 4px; background: rgba(6,8,20,.55); font: 13px var(--mono); }
  .fstrip[hidden] { display: none; }
  .fstrip h3 { margin: 0 6px 0 0; font: 700 13px var(--mono); color: var(--fc); }
  .fstrip .chips { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
  .chip { padding: 2px 8px; border-radius: 4px; border: 2px solid var(--rule); color: var(--ink-dim); white-space: nowrap; }
  .chip.done { border-color: #38c848; color: #b8f0b8; }
  .chip.part { border-color: var(--gold); color: var(--gold); }
  .chip.stuck { border-color: #e02828; color: #ffb0a8; background: rgba(224,40,40,.15); }
  .chip.unknown { border-style: dashed; border-color: var(--ink-dim); color: var(--ink); background: rgba(208,212,232,.12); }
  .chip.live { border-color: var(--gold); background: var(--gold); color: #241400; font-weight: 700; }
  .fstrip .sep { color: var(--ink-dim); }
  .fstrip .mode { margin-left: auto; color: var(--ink-dim); font-size: 12px; }
  .fstrip button { background: var(--win-bot); color: var(--ink); border: 2px solid var(--win-inner); border-radius: 4px; font: 700 12px var(--mono); padding: 3px 10px; cursor: pointer; }
  .dialog .subs li { display: flex; flex-wrap: wrap; gap: 0 8px; }
  .dialog .subs .w { color: var(--ink-dim); }
  .dialog .subs .drop { text-decoration: line-through; color: var(--ink-dim); }
  .dialog dl { margin: 8px 0 0; font: 13px/1.4 var(--mono); display: grid; grid-template-columns: max-content 1fr; gap: 2px 10px; }
  .dialog dt { color: var(--ink-dim); }
  .dialog dd { margin: 0; }
</style>
</head>
<body>
  <div class="bar">
    <div class="title">Worktree Hollow <span id="vname" class="vname"></span> <a id="repo" hidden target="_blank" rel="noopener"></a> <span id="workflow" class="status"></span> <select id="pick" aria-label="Village" hidden></select> <select id="theme" aria-label="Style"><option value="medieval">Medieval village</option><option value="modern">Modern business district</option><option value="future">Future</option></select> <label class="labels-toggle"><input type="checkbox" id="labels-on" checked> Labels</label> <span class="zoom" role="group" aria-label="Zoom"><button id="zoom-out" aria-label="Zoom out">−</button><button id="zoom-fit" title="Fit the map to the panel width">Fit</button><button id="zoom-in" aria-label="Zoom in">+</button></span> <a href="/">Dashboard</a></div>
    <div class="status" id="status" aria-live="polite">Connecting…</div>
  </div>
  <div class="win stage">
    <div class="viewport" id="viewport">
      <div class="empty" id="empty">Looking for swarms…</div>
      <canvas id="map" width="320" height="180" hidden aria-label="The swarm drawn as a village. Select a house to see its crew and issue."></canvas>
      <div class="alabels" id="alabels"></div><div class="hitkeys" id="hitkeys"></div>
      <div class="fbanners" id="fbanners"></div>
    </div>
    <div class="fstrip" id="fstrip" hidden>
      <h3 id="fs-title"></h3>
      <span class="chips" id="fs-chips" aria-live="polite"></span>
      <span class="mode" id="fs-mode"></span>
      <button id="fs-details">Details</button><button id="fs-stop">Stop following</button>
    </div>
    <div class="flow" id="flow"></div>
  </div>
  <div class="win dialog" id="dialog" hidden role="dialog" aria-live="polite">
    <button id="close" aria-label="Close">×</button>
    <h2 id="d-title"></h2>
    <p id="d-line"></p>
    <p class="dim" id="d-meta"></p>
    <div id="d-q"></div>
    <div class="links" id="d-links"></div>
  </div>

<script>
(() => {
  /* ---------- Palette (15-bit, outline #202030) ---------- */
  const P = {
    o: '#202030', skin: '#f8c898', skinS: '#d09068',
    grass: '#58a048', grassD: '#386830', grassL: '#88c858',
    path: '#d8b878', pathS: '#b08858', pathL: '#e8d098',
    wood: '#a06030', woodD: '#683818', woodL: '#c88848', plank: '#e0b070',
    stone: '#9898a8', stoneD: '#606078', stoneL: '#c8c8d8',
    roofB: '#4868b8', roofBD: '#283878',
    leaf: '#308838', leafD: '#205028', leafL: '#58b050',
    white: '#f8f8f8', gold: '#f8d040', glass: '#a8d0f0', lamp: '#f8e080', dark: '#383850',
    red: '#c04838', redD: '#802828', thatch: '#c8a048', thatchD: '#907028',
    teal: '#2878a0', tealD: '#185070', parch: '#e8dcc0',
    purple: '#7848a8', purpleD: '#503078', copper: '#d08840',
    slate: '#6878a0', slateD: '#485878', barn: '#a83028', barnD: '#701818',
    bug: '#e03838', fizzA: '#e070d0', fizzB: '#60e0c8', shield: '#3058b0', mill: '#d8c8a8', millD: '#a89878', sail: '#f0e8d8',
    dome: '#e0e4f0', domeD: '#a8b0c8', water: '#3870c0', waterD: '#2850a0', waterL: '#80b8f0',
    p0: '#e02828', seal: '#38c848', web: '#d8d8e8'
  };
  const STATE = { blocked: '#f07020', done: '#3878e0', unknown: '#585870', stalled: '#8088a8' };
  const KINDCOL = { bug: '#e03838', feature: '#40b8e8', tests: '#e070d0', security: '#3058b0', research: '#c0a8f0', perf: '#d8c8a8', refactor: '#6878a0', docs: '#2878a0', chores: '#a83028', workshop: '#c88848', cottage: '#c8a048' };
  const NOTECOL = { 'needs-design': '#f8c800', 'needs-clarification': '#d0c0f8', 'needs-approval': '#e89890', 'too-complex': '#b02010', 'future': '#8088a8', 'proposal': '#c0a8f0', 'failed': '#e02828', 'unreachable': '#585870' };
  const STOPCOL = ['#38c848', '#f8d040', '#f8f8f8', '#4868e8', '#e070d0'];
  /* One cloth colour per feature banner, in the order the server lists them. */
  const FEATURE_COLS = ['#40b8e8', '#e070d0', '#60e0c8', '#f07020', '#c0a8f0', '#a8c8f8'];
  /* A sub-agent's accent (tie, apron, belt) matches the building its specialty would build. */
  const SPECIALTIES = [['architect', 'research'], ['security', 'security'], ['test', 'tests'], ['doc', 'docs'], ['coder', 'feature']];
  const subHat = s => {
    const role = s.agent_type.toLowerCase().split(':').pop();
    const hit = SPECIALTIES.find(([name]) => role.includes(name));
    return hit ? KINDCOL[hit[1]] : P.white;
  };

  const R = (c, x, y, w, h, col) => { c.fillStyle = col; c.fillRect(Math.round(x), Math.round(y), w, h); };
  function hash(x, y) {
    let n = (Math.imul(x, 374761393) + Math.imul(y, 668265263)) | 0;
    n = Math.imul(n ^ (n >>> 13), 1274126177);
    return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
  }
  const blink = (t, ms) => Math.floor(t / ms) % 2 === 1;
  /* Someone who needs you waves: arm up, hand swinging. Reduced motion keeps the arm up, still. */
  const waveFrame = t => blink(t, 220) ? 'wave2' : 'wave';
  /* Light comes from the upper left: shadows fall right and down. */
  const SHADE = 'rgba(12,20,36,.28)', SHINE = 'rgba(255,255,240,.22)';
  const shadow = (c, x, y, w, h) => R(c, x, y, w, h, SHADE);
  const lit = st => st === 'working';
  const glassOf = st => st === 'working' ? P.lamp : (st === 'unknown' || st === 'stopped') ? P.dark : P.glass;
  function win(c, x, y, st) {
    R(c, x, y, 4, 4, P.woodD); R(c, x + 1, y + 1, 2, 2, glassOf(st));
    if (st === 'working') R(c, x + 1, y + 1, 1, 1, P.white);
    // A flower box under every window.
    R(c, x, y + 4, 4, 1, P.woodL); R(c, x, y + 3, 1, 1, '#e05050'); R(c, x + 3, y + 3, 1, 1, P.gold);
  }
  function door(c, x, y, st) {
    if (st === 'blocked') { R(c, x, y, 4, 5, P.o); return; }
    R(c, x, y, 4, 5, P.woodD); R(c, x + 2, y + 2, 1, 1, P.gold);
  }
  function gable(c, x, y, w, h, a, d) {
    R(c, x, y, w, h, P.o);
    for (let r = 1; r < h - 1; r++) R(c, x + 1, y + r, w - 2, 1, (r % 3 === 0) ? d : a);
    R(c, x + 1, y + 1, w - 2, 1, d);
    // Shingles on the lit slope, shade on the far one, a sunlit ridge.
    for (let r = 2; r < h - 1; r += 3) for (let k = x + 2 + (r % 2) * 2; k < x + w - 2; k += 4) R(c, k, y + r, 1, 1, d);
    R(c, x + 1 + Math.ceil((w - 2) * 0.62), y + 1, Math.floor((w - 2) * 0.38), h - 2, SHADE);
    R(c, x + 1, y + 1, Math.ceil((w - 2) * 0.62), 1, SHINE);
    R(c, x + 1, y + h - 1, w - 2, 1, SHADE);
  }
  function wall(c, x, y, w, h, col) {
    R(c, x, y, w, h, P.o); R(c, x + 1, y, w - 2, h - 1, col);
    R(c, x + 1, y + h - 2, w - 2, 1, P.stoneD);
    R(c, x + w - 3, y, 2, h - 2, SHADE);
  }
  function puffs(c, x, y, t, a, b) {
    for (let k = 0; k < 3; k++) {
      const p = ((t / 110) + k * 7) % 21;
      const s = p < 9 ? 2 : 1;
      R(c, x + Math.round(Math.sin((p + k * 2) / 3)), y - Math.floor(p * 0.6), s, s, p < 12 ? a : b);
    }
  }

  /* ---------- Houses: each draws in x..x+15, y-4..y+16 ---------- */
  const B = {
    cottage(c, x, y, st, t, roof = P.thatch, roofD = P.thatchD) {
      R(c, x + 11, y - 2, 4, 5, P.o); R(c, x + 12, y - 1, 2, 4, P.stone);
      gable(c, x, y + 1, 16, 9, roof, roofD);
      wall(c, x + 1, y + 9, 14, 7, P.wood); R(c, x + 2, y + 9, 12, 1, P.woodD);
      win(c, x + 2, y + 10, st); win(c, x + 10, y + 10, st); door(c, x + 6, y + 11, st);
      if (lit(st)) puffs(c, x + 12, y - 4, t, P.white, P.stoneL);
    },
    workshop(c, x, y, st, t) {
      B.cottage(c, x, y, st, t, P.red, P.redD);
      R(c, x + 4, y + 4, 6, 3, P.o); R(c, x + 5, y + 4, 4, 1, P.stoneL); R(c, x + 6, y + 5, 2, 1, P.stoneL);
    },
    feature(c, x, y, st, t) {
      gable(c, x, y + 1, 11, 9, P.red, P.redD);
      wall(c, x + 1, y + 9, 10, 7, P.wood); R(c, x + 2, y + 9, 8, 1, P.woodD);
      win(c, x + 2, y + 10, st); door(c, x + 6, y + 11, st);
      R(c, x + 11, y + 2, 1, 14, P.plank); R(c, x + 15, y + 2, 1, 14, P.plank);
      R(c, x + 10, y + 2, 6, 1, P.plank); R(c, x + 11, y + 7, 5, 1, P.plank);
      for (let k = 0; k < 4; k++) R(c, x + 12 + k, y + 3 + k, 1, 1, P.woodL);
      R(c, x + 11, y + 12, 5, 1, P.plank); R(c, x + 11, y + 13, 5, 1, P.woodD); R(c, x + 11, y + 14, 5, 1, P.plank); R(c, x + 11, y + 15, 5, 1, P.o);
      if (lit(st) && blink(t, 140)) { R(c, x + 12 + (Math.floor(t / 280) % 3), y + 6, 1, 1, P.white); R(c, x + 13, y + 5, 1, 1, P.gold); }
    },
    bug(c, x, y, st, t) {
      gable(c, x, y + 1, 16, 9, P.thatch, P.thatchD);
      R(c, x + 3, y + 3, 5, 4, P.woodD); R(c, x + 4, y + 4, 3, 2, P.plank); R(c, x + 5, y + 4, 1, 2, P.woodD);
      wall(c, x + 1, y + 9, 14, 7, P.wood); R(c, x + 2, y + 9, 12, 1, P.woodD);
      win(c, x + 2, y + 10, st); door(c, x + 6, y + 11, st);
      R(c, x + 11, y + 2, 1, 14, P.woodL); R(c, x + 14, y + 2, 1, 14, P.woodL);
      for (let yy = y + 3; yy < y + 16; yy += 3) R(c, x + 11, yy, 4, 1, P.woodD);
      R(c, x + 9, y - 1, 1, 2, P.o);
      R(c, x + 6, y - 4, 7, 4, P.o); R(c, x + 7, y - 3, 5, 2, P.bug); R(c, x + 8, y - 3, 1, 1, P.o); R(c, x + 10, y - 2, 1, 1, P.o); R(c, x + 9, y - 3, 1, 2, P.o);
      if (lit(st)) R(c, x + 2 + Math.floor(t / 160) % 8, y + 7, 2, 1, P.o);
    },
    security(c, x, y, st, t) {
      R(c, x, y + 10, 4, 6, P.o); R(c, x + 1, y + 11, 2, 4, P.stone);
      R(c, x + 12, y + 10, 4, 6, P.o); R(c, x + 13, y + 11, 2, 4, P.stone);
      R(c, x + 3, y - 2, 10, 18, P.o); R(c, x + 4, y - 1, 8, 16, P.stone); R(c, x + 4, y - 1, 8, 1, P.stoneL);
      for (let yy = y + 1; yy < y + 14; yy += 3) for (let xx = x + 5 + ((yy - y) % 2 ? 2 : 0); xx < x + 11; xx += 4) R(c, xx, yy, 1, 1, P.stoneD);
      [3, 7, 11].forEach(dx => R(c, x + dx, y - 4, 2, 2, P.o));
      R(c, x + 5, y + 1, 1, 3, glassOf(st)); R(c, x + 10, y + 1, 1, 3, glassOf(st));
      R(c, x + 6, y + 4, 4, 4, P.gold); R(c, x + 7, y + 5, 2, 2, P.shield); R(c, x + 7, y + 8, 2, 1, P.gold);
      door(c, x + 6, y + 11, st);
      if (lit(st)) R(c, x + 7, y - 5, 2, 1, blink(t, 160) ? P.gold : P.lamp);
    },
    tests(c, x, y, st, t) {
      gable(c, x, y + 1, 16, 9, P.purple, P.purpleD);
      R(c, x + 2, y - 2, 5, 1, P.o); R(c, x + 3, y - 1, 3, 3, P.o); R(c, x + 4, y - 1, 1, 3, P.copper);
      R(c, x + 9, y + 2, 2, 1, P.o); R(c, x + 8, y + 3, 4, 4, P.o); R(c, x + 9, y + 4, 2, 2, lit(st) ? (blink(t, 300) ? P.fizzA : P.fizzB) : P.glass);
      wall(c, x + 1, y + 9, 14, 7, P.wood); R(c, x + 2, y + 9, 12, 1, P.woodD);
      win(c, x + 2, y + 10, st); win(c, x + 10, y + 10, st); door(c, x + 6, y + 11, st);
      if (lit(st)) puffs(c, x + 4, y - 4, t, P.fizzA, P.fizzB);
    },
    research(c, x, y, st, t) {

  /* ---------- Layout ---------- */
  const LW = 20, LH = 26, RD = 6, DOCK_W = 64;
  function layout(v) {
    const n = v.houses.length;
    const per = Math.max(1, Math.ceil(Math.sqrt(Math.max(n, 1) / 2)));
    const rows = Math.max(1, Math.ceil(n / (2 * per)));
    const cx0 = DOCK_W + 8;
    const vw = Math.max(per * LW * 2 + RD, 72);

    const hallX = roadX + RD / 2 - 16;
    const top = 60;
    const lots = [];
    for (let i = 0; i < rows * 2 * per; i++) {
      const r = Math.floor(i / (2 * per)), j = i % (2 * per), side = j % 2, pos = Math.floor(j / 2);
      const x = side === 0 ? roadX - (pos + 1) * LW + 2 : roadX + RD + pos * LW + 2;

    const lockStart = roadX + 40;

  window.addEventListener('resize', () => { fit(); placeBanners(); });

  /* Which village this is, always in the bar (the picker shows it only when
   * there are two or more), plus its GitHub page when a real issue URL shows
   * which repo it is (`repoUrl`), never a guess. */
  function nameBar(name, v) {
    const vn = document.getElementById('vname'), a = document.getElementById('repo'), repo = v ? repoUrl(v) : null;
    vn.textContent = name;
    vn.hidden = !pick.hidden;
    a.hidden = !repo;
    if (repo) { a.href = repo; a.textContent = repo.replace(/^https:\/\/github\.com\//, '') + ' on GitHub'; }
  }

  /* `· autocoder · development`, `· agentex · runtime`: which framework drew it, and which half of the loop it is. */
  function describe(v) {
    const fw = v.workflow || v.framework;
    return [fw, v.plane].filter(Boolean).map(x => '· ' + x).join(' ');
  }
  /* Show a village (`shop`) or a world (`world:shop`). */
  function select(name) {
    const w = worlds.find(x => x.name === name);
    const v = villages.find(x => x.project === name);
    if (w) view = { world: w.name };
    else if (v || villages[0]) view = { village: (v || villages[0]).project };
    else return;
    if (view.world) {
      document.getElementById('workflow').textContent = `· ${w.dev} builds ${w.platform}`;
      nameBar(`${w.dev} \u21c4 ${w.platform}`, villages.find(x => x.project === w.dev));
      renderWorldFlow(w);
    } else {
      const sc = scenes[view.village];
      document.getElementById('workflow').textContent = describe(sc.v);
      nameBar(sc.v.project, sc.v);
      if (cv.width !== sc.L.W || cv.height !== sc.L.H) { cv.width = sc.L.W; cv.height = sc.L.H; }
      renderFlow(sc.v);
    }
    fit();
    if (reduce) draw(0);
    placeBanners();
  }
  function draw(t) {
    if (!view) return;
    ctx.imageSmoothingEnabled = false;
    if (view.world) { const w = worlds.find(x => x.name === view.world); if (w) drawWorld(t, w); return; }
    const sc = scenes[view.village];
    if (sc && sc.v) drawVillage(ctx, sc, t);
  }
  const themePick = document.getElementById('theme');
  themePick.value = themeName;
  themePick.addEventListener('change', () => {
    themeName = themePick.value; T = THEMES[themeName];
    try { localStorage.setItem('village-theme', themeName); } catch {}
    if (view) select(view.world || view.village);
  });
  pick.addEventListener('change', () => { location.hash = pick.value; select(pick.value); });
  window.addEventListener('hashchange', () => select(decodeURIComponent(location.hash.slice(1))));

  async function poll() {
    try {
      const res = await fetch('/api/village');
      if (!res.ok) throw new Error(res.status);
      const data = await res.json();
      villages = data.villages || [];
      worlds = data.worlds || [];
      const t = performance.now();
      villages.forEach(v => updateScene(v, t));
      worlds.forEach(w => updateWorld(w, t));
      const names = [...worlds.map(w => w.name), ...villages.map(v => v.project)];
      const label = n => { const w = worlds.find(x => x.name === n); return w ? `${w.dev} \u21c4 ${w.platform}` : n; };
      pick.hidden = names.length < 2;
      if (pick.options.length !== names.length || [...pick.options].some((o, i) => o.value !== names[i])) {
        pick.innerHTML = names.map(n => `<option value="${esc(n)}">${esc(label(n))}</option>`).join('');
      }
      const want = decodeURIComponent(location.hash.slice(1)) || (view && (view.world || view.village)) || names[0];
      if (names.includes(want)) pick.value = want;
      document.getElementById('empty').hidden = villages.length > 0;
      cv.hidden = villages.length === 0;
      if (!villages.length) document.getElementById('empty').textContent = 'No swarms running. Start one from the dashboard or the agents-tui terminal.';
      else select(pick.value || names[0]);
      document.getElementById('status').textContent = 'Live · updated ' + new Date().toLocaleTimeString();
    } catch (e) {
      document.getElementById('status').textContent = "Can't reach agents-tui. Retrying…";
    }
    setTimeout(poll, 3000);
  }
  poll();

  if (!reduce) {
    // The first frame records what is clickable; place the keyboard targets then, not a poll later.
    const loop = t => { draw(t); if (!kbuttons.size && kbox.dataset.placed !== String(view && (view.world || view.village))) { kbox.dataset.placed = String(view && (view.world || view.village)); placeKeys(); } requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
